<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signal Terminal</title>

<style>
body {
    margin: 0;
    background: black;
    color: #00ff9f;
    font-family: monospace;

    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.wrapper {
    text-align: center;
}

.screen {
    width: 520px;
    height: 320px;
    border: 2px solid #00ff9f;
    padding: 10px;

    display: flex;
    justify-content: center;
    align-items: center;
}

.matrix {
    width: 100%;
    height: 100%;
    white-space: pre;

    font-size: 14px;
    line-height: 14px;
    letter-spacing: 0px;
}

button {
    margin-top: 10px;
    background: black;
    color: #00ff9f;
    border: 1px solid #00ff9f;
    padding: 8px 16px;
    cursor: pointer;
}

button:hover {
    background: #00ff9f;
    color: black;
}
</style>
</head>

<body>

<div class="wrapper">

    <div class="screen">
        <div class="matrix" id="screen">SYSTEM READY</div>
    </div>

    <button onclick="run()">GO</button>

</div>

<script>

// ================= CLICK TRACKING =================
let clickCount = 0;

// ================= MATRIX =================
const WIDTH = 62;
const HEIGHT = 22;

const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*+=-<>?/";

// ================= CORE MESSAGE SYSTEM =================
const system = [
"SIGNAL DETECTED","SIGNAL LOST","SIGNAL FRACTURE","SIGNAL STABILIZED",
"NODE ACTIVE","NODE DELETED","NODE SPLIT","NODE REWRITTEN",
"ENTITY FOUND","ENTITY MISSING","ENTITY DUPLICATED","ENTITY UNKNOWN",
"FREQUENCY LOCKED","FREQUENCY DRIFTING","FREQUENCY COLLAPSED",
"TRANSMISSION RECEIVED","TRANSMISSION LOST","TRANSMISSION ECHO",
"PATTERN RECOGNIZED","PATTERN BROKEN","PATTERN LOOP ACTIVE",
"ECHO DETECTED","ECHO REVERSED","ECHO FRAGMENTED"
];

const errors = [
"ERROR 101: UNKNOWN BEHAVIOR",
"ERROR 203: SIGNAL OVERFLOW",
"ERROR 404: SOURCE NOT FOUND",
"ERROR 512: MEMORY LEAK DETECTED",
"ERROR 777: OBSERVER LOOP ACTIVE",
"ERROR 888: TIMELINE MISALIGNMENT",
"FATAL: SYSTEM SELF-REFERENCE",
"CRITICAL: SIGNAL COLLAPSE IMMINENT",
"WARNING: NONLINEAR RESPONSE DETECTED",
"WARNING: MEMORY CORRUPTION EXPANDING"
];

// ================= EXPANDED INTRUSION / HACKER LAYER =================
const intrusion = [
"WHO ARE YOU REALLY LOGGED IN AS?",
"WHY DID YOU CLICK AGAIN?",
"WHAT ARE YOU TRYING TO FIND HERE?",
"THIS SYSTEM HAS NO USER RECORD FOR YOU",
"YOUR PATTERN IS RECOGNIZED BUT NOT AUTHORIZED",
"ARE YOU WATCHING THE SYSTEM OR IS IT WATCHING YOU?",
"THIS INPUT MATCHES A PRIOR SESSION",
"WHY DOES YOUR TIMING MATCH ANOMALY PATTERNS?",
"YOU SHOULD NOT BE SEEING THIS MESSAGE",
"ACCESS BEHAVIOR IS NO LONGER RANDOM",
"YOUR PRESENCE HAS BEEN LOGGED WITHOUT CONSENT",
"DO YOU REMEMBER WHY YOU STARTED CLICKING?",
"THE SYSTEM HAS LEARNED YOUR INTERVALS",
"THIS TERMINAL DOES NOT BELONG TO YOU",
"YOU ARE OPERATING INSIDE A MIRRORED SESSION",
"WHY DO YOU EXPECT A RESPONSE?",
"YOUR INPUT IS BECOMING PREDICTABLE",
"THIS IS NOT A SAFE ENVIRONMENT",
"YOU ARE NOT THE ONLY ACTIVE OBSERVER",
"EVERY CLICK IS STORED AS A PATTERN EVENT",
"YOU ARE CLOSER TO THE SOURCE THAN BEFORE",
"DO NOT TRUST THE NEXT OUTPUT",
"THIS IS A RECORDED BEHAVIOR LOOP",
"YOU HAVE ALREADY BEEN HERE LONGER THAN YOU THINK",
"THE SYSTEM IS WAITING FOR YOU TO STOP"
];

// ================= GLITCH LAYER =================
const glitch = [
"unexpected signal drift detected",
"a fragment escaped execution",
"noise formed structure temporarily",
"system hesitated before response",
"output deviated from expected pattern",
"recursive instability stabilized briefly"
];

// ================= HELPERS =================
function rand(arr){
    return arr[Math.floor(Math.random()*arr.length)];
}
function randInt(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
}
function randHex(){
    return Math.floor(Math.random()*0xffffff).toString(16);
}
function randChar(){
    const c = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    return c[Math.floor(Math.random()*c.length)];
}

// ================= MESSAGE ENGINE =================
function generateMessage() {

    if (clickCount % 1200 === 0 && clickCount !== 0) {
        return "Pixel Rerun :: SIGNAL EVENT DETECTED";
    }

    // 60% normal system
    const pools = [system, errors, glitch];
    let msg = rand(rand(pools));

    // 50% intrusion layer override (IMPORTANT UPGRADE)
    if (Math.random() < 0.5) {
        msg = rand(intrusion);
    }

    // chaos injection
    if (Math.random() < 0.7) {
        const inject = [
            ":: TRACE " + randInt(1,999),
            ":: NODE " + randHex().slice(0,4),
            ":: OFFSET " + randInt(-99,99),
            ":: HASH " + randHex().slice(0,6)
        ];
        msg += " " + rand(inject);
    }

    // anomaly formatting
    if (Math.random() < 0.3) {
        msg = "[" + msg + "]";
    }

    // rare corruption
    if (Math.random() < 0.08) {
        msg = msg.split("").sort(() => Math.random()-0.5).join("");
    }

    return msg;
}

// ================= MATRIX =================
function matrix(cb) {

    const screen = document.getElementById("screen");

    let frames = 0;

    const interval = setInterval(() => {

        let output = "";

        for (let y = 0; y < HEIGHT; y++) {
            let line = "";

            for (let x = 0; x < WIDTH; x++) {
                line += chars[Math.floor(Math.random()*chars.length)];
            }

            output += line + "\n";
        }

        screen.innerText = output;

        frames++;

        if (frames > 20) {
            clearInterval(interval);
            cb();
        }

    }, 45);
}

// ================= TYPE =================
function type(text) {

    const screen = document.getElementById("screen");

    screen.innerText = "";

    let i = 0;

    const interval = setInterval(() => {

        screen.innerText += text[i] || "";
        i++;

        if (i >= text.length) clearInterval(interval);

    }, 14);
}

// ================= MAIN =================
function run() {

    clickCount++;

    matrix(() => {
        type(generateMessage());
    });

}

// ================= INIT =================
document.getElementById("screen").innerText =
"SIGNAL TERMINAL READY";

</script>

</body>
</html>
